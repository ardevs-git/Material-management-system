instructions: |
  StockSense is a static inventory management application.
  Preserve the existing inventory-first scope and browser localStorage data model.
  Do not add POS, billing, KOT, tables, payments, recipes, or consumption features.
  Keep changes compatible with the current HTML, CSS, and JavaScript architecture.
  Validate JavaScript changes with `node --check .\app.js`.

server_ready_pattern: '(?i)(https?://127\.0\.0\.1:\d+)'
auto_open_in_browser: true

automation:
  auto_issue_session: true
  remote_control: false
