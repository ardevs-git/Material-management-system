<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Rajmudra — Restaurant Inventory OS</title>
  <meta name="description" content="Hotel Rajmudra — Restaurant Inventory OS and Material Management System (Hinjawadi, Pune)" />
  <meta property="og:title" content="Hotel Rajmudra — Restaurant Inventory OS" />
  <meta property="og:description" content="Hotel Rajmudra — Restaurant Inventory OS and Material Management System (Hinjawadi, Pune)" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand" id="brand-header" onclick="showView('inventory')" style="cursor:pointer;" title="StockSense">
        <span class="stocksense-brand-title">StockSense</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item" data-view="dashboard" id="nav-dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Dashboard
        </button>
        <button class="nav-item active" data-view="inventory" id="nav-inventory">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          Stock
        </button>
        <button class="nav-item" data-view="add-product" id="nav-add-product" onclick="openModal('product')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          + Add Product
        </button>
        <button class="nav-item" data-view="purchasing" id="nav-purchasing">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          Purchases
        </button>
        <button class="nav-item" data-view="sales" id="nav-sales">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Sales
        </button>
        <button class="nav-item" data-view="outward" id="nav-outward">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          Outward
        </button>
        <button class="nav-item" data-view="accounts" id="nav-accounts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Accounts
        </button>
        <button class="nav-item" data-view="reports" id="nav-reports">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
          Reports
        </button>
        <button class="nav-item" data-view="settings" id="nav-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
        <button class="nav-item" data-view="about-dev" id="nav-about-dev">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          About Developer
        </button>
      </nav>

      <div class="sidebar-copyright">
        &copy; 2024 StockSense Inc.
      </div>
    </aside>

    <main class="main" id="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-page-title" id="page-title">Stock</h1>
        </div>

        <div class="topbar-actions-group">
          <button class="topbar-btn topbar-btn-purchase" id="btn-top-purchase" onclick="newPurchase()" title="Create Purchase Entry">
            <span>＋</span> Purchase
          </button>
          <button class="topbar-btn topbar-btn-outward" id="btn-top-outward" onclick="newOutward()" title="Record Stock Outward">
            <span>＋</span> Outward
          </button>
          <button class="topbar-btn topbar-btn-new-item" id="btn-top-new-item" onclick="openModal('product')" title="Add New Product Master">
            <span>＋</span> New Item
          </button>

          <div class="role-selector-wrap">
            <select id="top-role-select" onchange="switchCurrentUserRole(this.value)">
              <option value="Admin">Admin</option>
              <option value="Owner">Owner</option>
              <option value="Store Manager">Store Manager</option>
              <option value="Accountant">Accountant</option>
              <option value="Chef">Chef</option>
            </select>
          </div>

          <div class="user-badge-profile" id="user-profile-trigger" onclick="toggleUserDropdown(event)" title="User Profile">
            <div class="user-avatar-circle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="user-meta-stack">
              <b id="topbar-user-name">Admin User</b>
              <span id="topbar-user-role">Admin</span>
            </div>
            <div id="user-dropdown" class="header-popover user-popover"></div>
          </div>
        </div>
      </header>

      <div id="app-content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal-root"></div>
  <div id="product-search-popover" class="product-search-popover"></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="closing-stock-import.js"></script>
  <script src="app.js"></script>
</body>
</html>
